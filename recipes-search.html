<div class="app">
  <a class="back" href="recipes.html">&larr; Back to the cookbook</a>
  <header class="top">
    <h1>&#128269; Search Recipes</h1>
    <p class="sub" id="searchsub">Search the whole cookbook by recipe name or ingredient.</p>
  </header>
  <div class="srow"><input id="q" type="search" placeholder="Try: chicken, chocolate, soup&hellip;" aria-label="Search recipes"></div>
  <div class="scopebar" id="scopebar" hidden>Searching in <b id="scopename"></b><button type="button" id="scope-clear">Search all recipes</button></div>
  <p class="rcount" id="rcount"></p>
  <div class="ctrack" id="results"></div>
  <footer>
    <p class="disc">Part of TreatYourselfDiscounts, the Pond. Welcome to the Pond!<br><a id="footacct" href="account.html" style="color:#1f5f74; font-weight:700;">Your Pond Account: sign up or log in</a></p>

</div>
<script>
/* Recipe search, on its own page. The cookbook lives in recipes.html, so
   this page fetches it once, then filters its cards by name or ingredient.
   When the Food page has a category shelf open, that category is saved and
   this page searches only inside it, with a visible scope bar to clear it. */
(function () {
  var cached = null;
  var cards = [];
  var scope = "";
  function readStoredScope() {
    try {
      var p = new URLSearchParams(location.search).get("cat");
      if (p && p.trim()) return p.trim();
    } catch (e) {}
    try { return (localStorage.getItem("tydRecipeSearchCat") || "").trim(); } catch (e) { return ""; }
  }
  function loadCookbook(cb) {
    if (cached) return cb(cached);
    fetch("recipes.html").then(function (r) { return r.text(); }).then(function (html) {
      cached = new DOMParser().parseFromString(html, "text/html");
      cards = Array.prototype.slice.call(cached.querySelectorAll(".recipe-card")).map(function (c) {
        var img = c.querySelector("img.photo");
        var cats = (c.getAttribute("data-cats") || "").split("|").map(function (x) { return x.trim(); }).filter(Boolean);
        return {
          id: c.id,
          name: c.querySelector("h2") ? c.querySelector("h2").textContent : c.id,
          search: (c.getAttribute("data-search") || "").toLowerCase(),
          home: cats.length ? cats[0] : "",
          img: img ? img.getAttribute("src") : ""
        };
      });
      var want = readStoredScope();
      if (want) {
        var hit = null;
        cards.forEach(function (c) { if (!hit && c.home && c.home.toLowerCase() === want.toLowerCase()) hit = c.home; });
        scope = hit || "";
      }
      applyScopeUI();
      cb(cached);
    }).catch(function () {
      document.getElementById("results").innerHTML = '<p class="note">Could not load the cookbook right now. Tap Refresh and try again.</p>';
    });
  }
  function applyScopeUI() {
    var bar = document.getElementById("scopebar"), sub = document.getElementById("searchsub"), input = document.getElementById("q");
    if (scope) {
      document.getElementById("scopename").textContent = scope;
      bar.hidden = false;
      sub.textContent = "Searching " + scope + " recipes by name or ingredient.";
      input.placeholder = "Search " + scope + " recipes, like chocolate";
    } else {
      bar.hidden = true;
      sub.textContent = "Search the whole cookbook by recipe name or ingredient.";
      input.placeholder = "Try: chicken, chocolate, soup\u2026";
    }
  }
  function clearScope() {
    scope = "";
    try { localStorage.removeItem("tydRecipeSearchCat"); } catch (e) {}
    try { var u = new URL(location.href); u.searchParams.delete("cat"); history.replaceState(null, "", u.pathname + u.search + u.hash); } catch (e) {}
    applyScopeUI();
    render(document.getElementById("q").value);
    document.getElementById("q").focus();
  }
  function render(q) {
    var host = document.getElementById("results");
    var count = document.getElementById("rcount");
    q = (q || "").trim().toLowerCase();
    var pool = scope ? cards.filter(function (c) { return c.home && c.home.toLowerCase() === scope.toLowerCase(); }) : cards;
    if (!q) {
      host.innerHTML = '<p class="note" style="font-size:15px;">Type a recipe name or an ingredient above. All ' + pool.length + (scope ? " " + scope : "") + ' recipes are searchable.</p>';
      count.textContent = "";
      return;
    }
    var hits = pool.filter(function (c) {
      return c.name.toLowerCase().indexOf(q) > -1 || c.search.indexOf(q) > -1;
    });
    count.textContent = hits.length + (hits.length === 1 ? " recipe found" : " recipes found") + (scope ? " in " + scope : "");
    if (!hits.length) {
      host.innerHTML = '<p class="note">No ' + (scope ? scope + " " : "") + 'recipes match &ldquo;' + q.replace(/</g, "&lt;") + '&rdquo;. Try a single ingredient, like chicken or chocolate.</p>';
      return;
    }
    host.innerHTML = "";
    hits.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "tile";
      var imgHtml = c.img
        ? '<span class="timg" style="background-image:url(\'' + c.img.replace(/'/g, "%27") + '\')"></span>'
        : '<span class="timg temoji">&#127860;</span>';
      b.innerHTML = imgHtml + '<span class="tname"></span>';
      b.querySelector(".tname").textContent = c.name;
      b.addEventListener("click", function () { location.href = "recipes.html#" + c.id; });
      host.appendChild(b);
    });
  }
  var input = document.getElementById("q");
  input.addEventListener("input", function () { render(input.value); });
  document.getElementById("scope-clear").addEventListener("click", clearScope);
  loadCookbook(function () { render(input.value); });
})();
</script>
