<script>
/* Meal Plan, on its own page. Meals live in localStorage tydMealPlan
   (the same store the cookbook writes when you tap "Plan it" on a recipe)
   and sync to your Pond Account when you are signed in. */
(function () {
  var PKEY = "tydMealPlan";
  function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} if (window.TYDMealSync) window.TYDMealSync.push(v); }
  function plan() { return load(PKEY, {}); }
  function esc(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function gcalUrl(dateISO, name, slug) {
    var d = dateISO.replace(/-/g, "");
    var next = new Date(dateISO + "T12:00:00"); next.setDate(next.getDate() + 1);
    var nd = next.toISOString().slice(0, 10).replace(/-/g, "");
    var details = "Recipe: " + location.origin + "/recipes.html#" + slug;
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent("Cook: " + name) + "&dates=" + d + "/" + nd + "&details=" + encodeURIComponent(details);
  }
  window.TYDGetMealPlan = plan;
  window.TYDSetMealPlan = function (p) { save(PKEY, p); render(); };
  function render() {
    var p = plan();
    var host = document.getElementById("plan-list");
    var dates = Object.keys(p).sort();
    if (!dates.length) {
      host.innerHTML = '<p class="note" style="font-size:15px;">No meals planned yet. Open a recipe in the cookbook and tap &ldquo;Plan it&rdquo; to add one here.</p>';
      return;
    }
    host.innerHTML = dates.map(function (d) {
      var label = new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      return p[d].map(function (it, idx) {
        return '<div class="pitem"><span class="pdate">' + esc(label) + '</span><a href="recipes.html#' + esc(it.slug) + '">' + esc(it.name) + '</a>' +
          '<a class="gcal" href="' + gcalUrl(d, it.name, it.slug) + '" target="_blank" rel="noopener">Add to Google Calendar</a>' +
          '<button class="gx" data-px="' + esc(d) + "|" + idx + '" aria-label="Remove this meal">&times;</button></div>';
      }).join("");
    }).join("");
    host.querySelectorAll("[data-px]").forEach(function (b) {
      b.addEventListener("click", function () {
        var parts = b.getAttribute("data-px").split("|");
        var p2 = plan();
        p2[parts[0]].splice(parseInt(parts[1], 10), 1);
        if (!p2[parts[0]].length) delete p2[parts[0]];
        save(PKEY, p2); render();
      });
    });
  }
  render();
})();
</script>
<script type="module">
import { initializeApp } from "./pond-firebase-stub.js";
import { getAuth, onAuthStateChanged } from "./pond-firebase-stub.js";
import { getFirestore, doc, getDoc, setDoc } from "./pond-firebase-stub.js";
var firebaseConfig = {
    apiKey: "preview-disabled",
    authDomain: "pond-preview-disabled.firebaseapp.com",
    projectId: "pond-preview-disabled",
    storageBucket: "pond-preview-disabled.firebasestorage.app",
    messagingSenderId: "000000000000",
    appId: "1:000000000000:web:previewdisabled"
  };
var app = initializeApp(firebaseConfig);
var auth = getAuth(app);
var db = getFirestore(app);
var currentUser = null;
window.TYDMealSync = {
  push: function (p) {
    if (!currentUser) return;
    setDoc(doc(db, "users", currentUser.uid), { mealPlan: p }, { merge: true }).catch(function () {});
  }
};
onAuthStateChanged(auth, function (user) {
  currentUser = user;
  var note = document.getElementById("syncnote");
  if (!user) { if (note) note.style.display = "none"; return; }
  if (note) {
    note.style.display = "block";
    note.textContent = "You are logged in as " + user.email + ", so your meal plan syncs to your Pond account on any device.";
  }
  getDoc(doc(db, "users", user.uid)).then(function (snap) {
    var remote = (snap.exists() && snap.data().mealPlan) || {};
    var local = window.TYDGetMealPlan ? window.TYDGetMealPlan() : {};
    var merged = {};
    Object.keys(remote).forEach(function (d) { merged[d] = remote[d].slice(); });
    Object.keys(local).forEach(function (d) {
      merged[d] = merged[d] || [];
      local[d].forEach(function (it) {
        if (!merged[d].some(function (x) { return x.slug === it.slug; })) merged[d].push(it);
      });
    });
    if (window.TYDSetMealPlan) window.TYDSetMealPlan(merged);
  }).catch(function () {});
});
</script>
